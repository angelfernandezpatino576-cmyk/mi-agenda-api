name: build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Configurar Python
        uses: actions/setup-python@v5 # Actualizado a v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Crear APK
        # El comando --yes evita el error de "EOF when reading a line"
        run: flet build apk --module-name=main --yes

      - name: Subir APK generado
        # Actualizado a v4 para solucionar el error de depreciación
        uses: actions/upload-artifact@v4 
        with:
          name: Agente2026-APK
          path: build/apk/*.apk

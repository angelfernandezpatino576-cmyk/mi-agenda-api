name: Build APK Final Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalación y Configuración de Flet
        run: |
          python -m pip install --upgrade pip
          # Instalamos flet y nos aseguramos de que sus comandos sean visibles
          pip install flet groq tavily-python
          # Añadimos la ruta de los scripts de Python al sistema
          echo "PATH=$PATH:$HOME/.local/bin" >> $GITHUB_PATH

      - name: Crear APK (Usando ejecución directa)
        run: |
          # Usamos 'python -m flet' en lugar de solo 'flet' para evitar el error de comando no encontrado
          yes | python -m flet build apk app.py --org com.miagenda.agente --project agente2026 --verbose
          
      - name: Subir APK Final
        uses: actions/upload-artifact@v4
        with:
          name: AppAgenteIA
          path: build/apk/*.apk

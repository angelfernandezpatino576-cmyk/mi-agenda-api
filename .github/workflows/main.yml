name: Build APK Clean Install

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Limpieza y Descarga de Dependencias
        run: |
          # 1. Eliminar cualquier residuo de pip
          python -m pip install --upgrade pip
          pip cache purge
          
          # 2. Instalar herramientas base para que Flet no falle
          pip install --upgrade setuptools wheel
          
          # 3. Instalar Flet y librerías de IA ignorando instalaciones previas
          pip install --upgrade --force-reinstall flet groq tavily-python

      - name: Crear APK desde Cero
        run: |
          # Aceptamos licencias y construimos
          yes | flet build apk app.py --org com.miagenda.agente --project agente2026
          
      - name: Entregar APK Limpia
        uses: actions/upload-artifact@v4
        with:
          name: AppAgenteIA_Final
          path: build/apk/*.apk

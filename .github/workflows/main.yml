name: build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4 # Actualizado

      - name: Configurar Python
        uses: actions/setup-python@v5 # Actualizado
        with:
          python-version: '3.10'

      - name: Instalar Flet
        run: pip install flet

      - name: Crear APK
        # --yes evita que el proceso se quede esperando confirmación
        run: flet build apk --module-name main --yes

      - name: Subir APK
        # SOLUCIÓN AL ERROR DE GITHUB: Usamos v4
        uses: actions/upload-artifact@v4 
        with:
          name: Agente2026-APK
          path: build/apk/*.apk

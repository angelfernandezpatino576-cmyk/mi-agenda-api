name: Build APK Priority

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet y herramientas de empaquetado
        run: |
          # Actualizamos herramientas base antes de instalar Flet
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade flet groq tavily-python

      - name: Crear APK
        run: |
          # El comando 'yes |' acepta licencias automáticamente
          # Usamos app.py como base
          yes | flet build apk app.py --org com.miagenda.agente --project agente2026
          
      - name: Subir APK Final
        uses: actions/upload-artifact@v4
        with:
          name: AppAgenteIA
          path: build/apk/*.apk

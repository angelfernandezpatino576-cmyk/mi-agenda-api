name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install flet

    - name: Build APK
      uses: flet-dev/flet-action@v0.1.3
      with:
        # Nota: Asegúrate de que main.py esté en la raíz
        main-script: main.py 
        # Si quieres un icono personalizado, descomenta y añade la ruta
        # icon: assets/icon.png 

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente2026_APK
        path: build/apk/*.apk

name: Build APK Force Install

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalación de Emergencia
        run: |
          # 1. Forzar actualización de pip
          python -m pip install --upgrade pip
          
          # 2. Instalar Flet y dependencias con reintento y log detallado
          pip install --no-cache-dir --force-reinstall flet groq tavily-python
          
          # 3. VERIFICACIÓN: Si esto falla, el log nos dirá por qué
          python -m flet --version

      - name: Crear APK
        run: |
          # Usamos 'yes' para saltar cualquier confirmación de Flutter
          yes | flet build apk app.py --org com.miagenda.agente --project agente2026
          
      - name: Subir APK Final
        uses: actions/upload-artifact@v4
        with:
          name: AppAgenteIA
          path: build/apk/*.apk

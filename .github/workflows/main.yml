name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Crear APK (Comando Corregido)
        run: |
          flet build apk app.py

      - name: Preparar archivo para descarga
        run: |
          mv build/apk/*.apk AgenteIA_2026.apk
          zip -r AppInstalable.zip AgenteIA_2026.apk

      - name: Publicar Release Permanente
        uses: softprops/action-gh-release@v1
        with:
          files: AppInstalable.zip
          tag_name: v1.0.${{ github.run_number }}
          name: "Actualización v${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK Final Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalación de Flet y Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet groq tavily-python

      - name: Crear APK (Comando Oficial)
        run: |
          # Usamos directamente 'flet build'
          # El comando 'yes' responde a la pregunta del SDK de Flutter automáticamente
          yes | flet build apk app.py --org com.miagenda.agente --project agente2026
          
      - name: Subir APK Final
        uses: actions/upload-artifact@v4
        with:
          name: AppAgenteIA
          path: build/apk/*.apk
